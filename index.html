<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

         <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
        <title>
            <!--Emily Vides - first personal project
                Website for my boyfriend/Journal-->
        </title>
        <style type = "text/css">
            body{
                overflow-x: hidden;
               margin: 0;
                min-height: 100vh;
                background: linear-gradient(to bottom right, #ffe0e9, #ffc1cc);
            }
        
            *{
                box-sizing: border-box;
                text-decoration: none;
            }
           .navigationbar{
              display:flex;
              justify-content: center;
              padding: 15px 30px;
             background: rgba(255, 246, 247, 0.7);
             border-radius: 40px;
             width: fit-content;
             margin: 30px auto;
             box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
              
            }
            .nav-links{
                list-style: none;
                display:flex;
                gap: 20px;
                padding: 0;
                margin: 0;
            }
            .nav-links a{
                color: #800;
                font-size: 1em;
                transition: color 0.5s ease, transform 0.3s ease;
                padding: 10px 18px;
                border-radius: 25px;
            }
            .nav-links a:hover{
                background-color:rgba(230, 155, 189, 0.932);
                transition: color 1s ease;
            }
            .title{
                display:flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                margin-top: 40px;
                padding-top: 100px;
            }
            .title h1{
              position: absolute;
              z-index: 2;
              font-size: 170px;
              font-family:'Great Vibes', cursive;
              color: #800;
              text-align: center;
              text-shadow: 2px 2px 8px rgba(117, 16, 16, 0.6);
              padding-left: 25px;
              padding-right: 25px;
            }
            .title img{
                transform: translate(320px, 30px);
                height: 320px;
                width: 270px;
                z-index: 1;
                animation: float 5s ease-in-out infinite, fadeIn 10s ease forwards;
            }

            @keyframes fadeIn{
                from {opacity: 0;}
                to { opacity: 1;}
            }

            @media (max-width: 768px) {

  /* Title container */
  .title {
    padding-top: 60px;
    margin-top: 20px;
  }

  /* Main heading */
  .title h1 {
    position: static;          /* removes absolute positioning */
    font-size: 64px;           /* scales nicely on phones */
    text-align: center;
    padding: 0 10px;
  }

  /* Locket image */
  .title img {
    transform: none;           /* removes translate() */
    width: 140px;
    height: auto;
    margin-top: 10px;
  }

  /* Navigation bar */
  .navigationbar {
    padding: 12px 18px;
  }

  .nav-links {
    flex-wrap: wrap;           /* allows links to wrap */
    gap: 10px;
    justify-content: center;
  }

  .nav-links a {
    font-size: 0.95em;
    padding: 8px 14px;
  }
}
        </style>
    </head>

    <body>

                <li><a href="NuestraHistoria.html"> Nuestra historia </a></li>
            </ul>
        </div>
       </nav>
