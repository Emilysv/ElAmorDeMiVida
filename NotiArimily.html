        <style type = "text/css">
             body{
                position:relative;
               margin: 0;
                min-height: 100vh;
                display: grid;
                grid-template-rows: auto 1fr auto;
                background: linear-gradient(to bottom right, #ffe0e9, #ffc1cc);
            }
         
             .title{
                display:flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding-bottom: 15px;
             
            }
            .title h1{
              position: absolute;
              z-index: 2;
              font-size: 100px;
              font-family:'Great Vibes', cursive;
              color: #800;
              text-align: center;
              text-shadow: 2px 2px 8px rgba(117, 16, 16, 0.6);
              padding-left: 25px;
              padding-right: 25px;
            }
            .title img{
                transform: translate(490px, 15px);
                height: 200px;
                width: 150px;
                z-index: 1;
                animation: float 5s ease-in-out infinite, fadeIn 10s ease forwards;
            }
            *{
                text-decoration: none;
            }
          .navigationbar{
              display:flex;
              justify-content: center;
              padding: 15px 30px;
             background: rgba(255, 246, 247, 0.7);
             border-radius: 40px;
             width: fit-content;
             margin: 30px auto;
             box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
              
            }
            .nav-links{
                list-style: none;
                display:flex;
                gap: 20px;
                padding: 0;
                margin: 0;
            }
            .nav-links a{
                color: #800;
                font-size: 1em;
                transition: color 0.5s ease, transform 0.3s ease;
                padding: 10px 18px;
                border-radius: 25px;
            }
            .nav-links a:hover{
                background-color:rgba(230, 155, 189, 0.932);
                transition: color 1s ease;
            }
            .letter{
                display:flex;
                align-items: center;
                justify-content: center;
            }
            .letter img{
                height: 1000px;
                width: 700px;
                margin-top: 15px;
               
            }
              .footer{
              text-align: center;
              padding: 15px 0;
            }
           .footer img{
            width: 250px;
            animation: fadeIn 3s ease forwards infinite, fadeOut 3s ease-out infinite;
           }
             @keyframes fadeOut{
                from {opacity: 1;}
                to { opacity: 0;}
            }
      
        </style>
